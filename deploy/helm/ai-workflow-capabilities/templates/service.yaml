apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ai-workflows
  labels:
    app.kubernetes.io/name: ai-workflow-capabilities
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: ai-workflow-capabilities
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
